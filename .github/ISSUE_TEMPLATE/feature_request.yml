name: Feature request
description: Suggest a focused improvement to the bot.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user or maintainer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like and any alternatives considered.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This request concerns the open-source Discord bot rather than API content or availability.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
