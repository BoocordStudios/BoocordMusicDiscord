name: Bug report
description: Report a reproducible problem with the Discord bot.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For vulnerabilities or leaked credentials, stop and use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash where the problem occurs.
      placeholder: v5.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Runtime platform
      options:
        - Linux x86-64 (glibc)
        - Linux x86-64 (musl)
        - Linux ARM64
        - Windows x86-64
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Use command ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, passwords, private IDs, and signed media URLs before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
