name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify tag and build
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(mvn --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "v${project_version}" = "${GITHUB_REF_NAME}"
          mvn --batch-mode --no-transfer-progress clean verify

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_dir="target/release"
          asset_name="boocordmusic-${version}-linux-x86-64.jar"
          asset="${release_dir}/${asset_name}"
          mkdir -p "${release_dir}"
          cp target/boocordmusic.jar "${asset}"
          (cd "${release_dir}" && sha256sum "${asset_name}" > "${asset_name}.sha256")
          echo "jar=${asset}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${asset}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes_file}" ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              "${{ steps.assets.outputs.jar }}" \
              "${{ steps.assets.outputs.checksum }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Boocord Music Discord ${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}" \
              --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${{ steps.assets.outputs.jar }}" \
              "${{ steps.assets.outputs.checksum }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Boocord Music Discord ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
